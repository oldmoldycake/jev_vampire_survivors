name: Feature request or idea
description: A new question for Jev, a dashboard change, a script, anything else
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a small project with an opinionated shape, so the most useful thing you can do
        here is say what you want it to *do* — the design doc in
        [`docs/superpowers/specs/`](https://github.com/oldmoldycake/jev_vampire_survivors/tree/main/docs/superpowers/specs)
        explains the constraints any implementation has to work within.

  - type: textarea
    id: idea
    attributes:
      label: What should it do
      description: The behavior you want, and the problem it solves. Concrete beats abstract.
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Where does this belong
      description: >-
        The plugin is deliberately thin: it reads raw state and applies answers, and holds no
        strategy of its own. Anything that decides *what to do* belongs in the brain —
        `brain/jev_vs/questions.py` for question wording and thresholds, `decide.py` for how an
        answer becomes an action. Best guess is fine; the next field is where you argue the case.
      options:
        - Brain — decision logic, a new question for Jev, wording, thresholds
        - Plugin — new state to read, or a new action to apply
        - Dashboard
        - Scripts, setup, or docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: why-not-the-brain
    attributes:
      label: If this needs the plugin to make a judgment call, why can't it be a question for Jev instead?
      description: >-
        Leave blank if it doesn't. If it does: the bar for putting strategy in the C# plugin is
        high, because that's the thing that has to be rewritten every time the game updates. Say
        what state the brain would need in order to decide this itself, and why that isn't
        workable.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives, or what you already tried
      description: >-
        Tuning you attempted in `questions.py` or `config.toml`, other shapes you considered, prior
        art from other mods.
    validations:
      required: false

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before you submit
      options:
        - label: I'd be up for implementing this myself, with a pointer or two.
          required: false
        - label: I agree to follow this project's [Code of Conduct](https://github.com/oldmoldycake/jev_vampire_survivors/blob/main/CODE_OF_CONDUCT.md).
          required: true
