[project]
name = "jev-vs"
version = "0.1.0"
description = "Jev plays Vampire Survivors: the decision brain"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.6.0",
    "aiohttp>=3.14",
]

[project.scripts]
jev-vs = "jev_vs.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py312"
# The brain is written wide on purpose: lookup tables, wire-format dict literals and
# log lines. Measured over the package and tests, 99% of lines already fit in 120.
line-length = 120

[tool.ruff.lint]
# Pragmatic and explicit: pycodestyle errors, pyflakes, import sorting, pyupgrade,
# and the bugbear traps. No preview rules and nothing that wants type annotations.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls the real TypeSafe API (needs TYPESAFE_API_KEY)"]
addopts = "-m 'not live'"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_vs"]
