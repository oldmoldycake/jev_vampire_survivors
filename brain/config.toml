# Runtime settings for the Jev Vampire Survivors brain.
# Question wording and thresholds are NOT here: see jev_vs/questions.py.

[plugin]
host = "127.0.0.1"
port = 48231

[dashboard]
host = "127.0.0.1"
port = 48232

[brain]
# Not read at runtime: the plugin drives the tick cadence (TickHz in its BepInEx config).
tick_hz = 4.0
model = "jev-latest"
request_timeout_s = 0.8
max_retries = 1
log_dir = "runs"
# Dashboard pins (character/stage) and the menu rosters behind their dropdowns.
# Relative to the working directory, exactly like log_dir.
state_file = "pins.json"
